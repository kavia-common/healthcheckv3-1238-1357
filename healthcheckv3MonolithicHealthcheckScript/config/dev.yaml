environment: dev
logging:
  level: INFO
  file: /tmp/du_healthcheck_dev.log
kubernetes:
  site_label_key: siteId
pods:
  pod1:
    label_selector: "app=pod1"
    required_containers: ["du-core", "du-aux"]
  pod2:
    label_selector: "app=pod2"
    required_containers: ["du-rt", "du-mon"]
ignore_containers:
  pod1: []
  pod2: []
thresholds:
  cpu_max: 1500    # in millicores (m)
  memory_max: 2048 # in Mi
  disk_max: 85     # percent
  rach_degraded: 500
  rach_degrading_min: 500
  rach_healthy_min: 1000
kafka:
  brokers: ["localhost:9092"]
  topic: "du-health"
  tls_enabled: false
  ca_path:
  username:
  password:
loki:
  endpoint: "http://localhost:3100/loki/api/v1/push"
  tenant_id:
log_paths:
  sctp: "/var/log/du/sctp.log"
  rach: "/var/log/du/rach.log"
  pucch: "/var/log/du/pucch.log"
