{{- if and .Values.secrets.create .Values.secrets.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (include "healthcheckv3.fullname" .) .Values.secrets.nameOverride }}
  labels:
    app.kubernetes.io/name: {{ include "healthcheckv3.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: |
{{ $v | indent 4 }}
{{- end }}
{{- end }}
